plugins {
    id 'base'
    alias(libs.plugins.architectury)
    alias(libs.plugins.loom) apply false
}

architectury { minecraft = libs.versions.minecraft.get() }

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.terraformersmc.com/releases/' }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = libs.versions.java.get().toInteger()
    }

    tasks.withType(JavaExec).configureEach { javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger()) } }
    tasks.withType(Test).configureEach { useJUnitPlatform() }

    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                from components.java
                artifactId = "${rootProject.archives_base_name}-${project.name}"
            }
        }
        repositories { mavenLocal() }
    }
}

tasks.register('verifyCommonIsolation') {
    group = 'verification'
    inputs.files(fileTree('common/src') { include '**/*.java' })
    doLast {
        def forbidden = ['net.fabricmc.', 'net.minecraftforge.', 'net.neoforged.']
        def violations = []
        inputs.files.files.sort().each { source ->
            source.eachLine { line, number ->
                if (forbidden.any { line.contains(it) }) violations << "${source}:${number}: ${line.trim()}"
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Loader imports found in common:\n${violations.join('\n')}")
        }
    }
}

def loaderJarFiles = ['fabric', 'forge'].collectEntries { loader ->
    [(loader): providers.provider { project(":${loader}").tasks.named('remapJar').get().archiveFile.get() }]
}

tasks.register('verifyLoaderJars') {
    group = 'verification'
    dependsOn ':fabric:remapJar', ':forge:remapJar'
    inputs.files(loaderJarFiles.values())
    doLast {
        def specifications = [
            fabric: [
                expected: 'fabric.mod.json',
                forbidden: ['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']
            ],
            forge: [
                expected: 'META-INF/mods.toml',
                forbidden: ['fabric.mod.json', 'META-INF/neoforge.mods.toml'],
                loaderVersion: '[52,)',
                dependencies: [
                    forge: ['mandatory=true', 'versionRange="[52.1.16,53)"'],
                    minecraft: ['mandatory=true', 'versionRange="[1.21.1]"'],
                    seamlessapi: ['mandatory=true', 'versionRange="[2.0.0,3.0.0)"']
                ]
            ]
        ]
        specifications.each { loader, specification ->
            def archive = loaderJarFiles[loader].get().asFile
            def expectedName = "${rootProject.archives_base_name}-${project.version}-${loader}.jar"
            if (archive.name != expectedName) {
                throw new GradleException("Unexpected artifact name ${archive.name}; expected ${expectedName}")
            }
            new java.util.zip.ZipFile(archive).withCloseable { zip ->
                zip.entries().findAll { it.name.endsWith('.class') }.each { entry ->
                    new DataInputStream(zip.getInputStream(entry)).withCloseable { header ->
                        if (header.readInt() != -889275714) throw new GradleException("Invalid class: ${entry.name}")
                        header.readUnsignedShort()
                        if (header.readUnsignedShort() > 65) throw new GradleException("Not Java 21 bytecode: ${entry.name}")
                    }
                }
                def metadataEntry = zip.getEntry(specification.expected)
                if (metadataEntry == null) {
                    throw new GradleException("${archive.name} is missing ${specification.expected}")
                }
                def metadata = zip.getInputStream(metadataEntry).getText('UTF-8')
                if (metadata.contains('${')) {
                    throw new GradleException("${archive.name} contains unexpanded metadata placeholders")
                }
                if (loader == 'fabric') {
                    def parsed = new groovy.json.JsonSlurper().parseText(metadata)
                    if (parsed.schemaVersion != 1 || parsed.id != 'swordthrow') {
                        throw new GradleException("${archive.name} contains unexpected Fabric schema/id metadata")
                    }
                    if (parsed.version != project.version.toString() || parsed.license != 'CC0-1.0') {
                        throw new GradleException("${archive.name} contains unexpected Fabric version/license metadata")
                    }
                    def expectedDependencies = [
                        fabricloader: '>=0.19.5',
                        'fabric-api': '>=0.116.17 <0.117.0',
                        minecraft: libs.versions.minecraft.get(),
                        java: '>=21',
                        seamlessapi: '>=2.0.0 <3.0.0'
                    ]
                    expectedDependencies.each { dependencyId, expectedRange ->
                        if (parsed.depends[dependencyId] != expectedRange) {
                            throw new GradleException(
                                "${archive.name} declares ${dependencyId}=${parsed.depends[dependencyId]}; expected ${expectedRange}"
                            )
                        }
                    }
                    def dependencyRanges = parsed.depends.values() + (parsed.suggests?.values() ?: [])
                    if (dependencyRanges.any { it == '*' || it.toString().contains('*') }) {
                        throw new GradleException("${archive.name} contains a wildcard dependency range")
                    }
                } else {
                    def requiredCoreValues = [
                        'modLoader="javafml"',
                        "loaderVersion=\"${specification.loaderVersion}\"",
                        'license="CC0-1.0"',
                        '[[mods]]',
                        'modId="swordthrow"',
                        "version=\"${project.version}\"",
                        '[features.swordthrow]',
                        'javaVersion="[21,)"'
                    ]
                    requiredCoreValues.each { value ->
                        if (!metadata.contains(value)) {
                            throw new GradleException("${archive.name} is missing processed metadata: ${value}")
                        }
                    }
                    def dependencyBlocks = metadata
                        .split(java.util.regex.Pattern.quote('[[dependencies.swordthrow]]'))
                        .drop(1)
                    specification.dependencies.each { dependencyId, expectedValues ->
                        def dependencyBlock = dependencyBlocks.find { it.contains("modId=\"${dependencyId}\"") }
                        if (dependencyBlock == null) {
                            throw new GradleException("${archive.name} is missing the ${dependencyId} dependency block")
                        }
                        expectedValues.each { value ->
                            if (!dependencyBlock.contains(value)) {
                                throw new GradleException(
                                    "${archive.name} ${dependencyId} dependency is missing ${value}"
                                )
                            }
                        }
                    }
                    def declaredRanges = metadata =~ /(?m)^(?:loaderVersion|versionRange|javaVersion)\s*=\s*"([^"]+)"/
                    if (declaredRanges.any { match -> match[1].contains('*') }) {
                        throw new GradleException("${archive.name} contains a wildcard loader/dependency range")
                    }
                }
                specification.forbidden.each { entry ->
                    if (zip.getEntry(entry) != null) {
                        throw new GradleException("${archive.name} contains stale metadata ${entry}")
                    }
                }
                if (zip.getEntry('io/github/derkottersberg/swordthrow/SwordThrow.class') == null) {
                    throw new GradleException("${archive.name} is missing common code")
                }
                [
                    'io/github/derkottersberg/swordthrow/config/SwordThrowServerConfig.class',
                    'io/github/derkottersberg/swordthrow/gameplay/ThrowItemRules.class',
                    'io/github/derkottersberg/swordthrow/network/ThrowStatePayload.class',
                    'data/swordthrow/tags/item/throwable.json',
                    'data/swordthrow/tags/item/cannot_throw.json',
                    'data/swordthrow/tags/item/spears.json',
                    'data/swordthrow/tags/item/embeddable.json'
                ].each { requiredEntry ->
                    if (zip.getEntry(requiredEntry) == null) {
                        throw new GradleException("${archive.name} is missing ${requiredEntry}")
                    }
                }
                def packagedEntries = zip.entries().collect { it.name }
                if (packagedEntries.any { it.toLowerCase(java.util.Locale.ROOT).contains('/gametest/') }) {
                    throw new GradleException("${archive.name} improperly ships GameTest classes or resources")
                }
                [
                    'io/github/derkottersberg/swordthrow/config/SwordThrowGameTestConfigAccess.class',
                    'data/swordthrow/tags/item/gametest_throwable.json',
                    'data/swordthrow/tags/item/gametest_cannot_throw.json'
                ].each { testOnlyEntry ->
                    if (packagedEntries.contains(testOnlyEntry)) {
                        throw new GradleException("${archive.name} improperly ships ${testOnlyEntry}")
                    }
                }
                if (zip.getEntry('com/derko/seamlessapi/api/visual/TrailMath.class') != null) {
                    throw new GradleException("${archive.name} improperly shades Seamless API")
                }
                if (loader == 'forge') {
                    def manifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
                    def manifest = manifestEntry == null
                        ? ''
                        : zip.getInputStream(manifestEntry).getText('UTF-8')
                    if (!manifest.contains('Automatic-Module-Name: io.github.derkottersberg.swordthrow')) {
                        throw new GradleException("${archive.name} is missing its stable Java module name")
                    }
                }
            }
        }
    }
}

tasks.named('assemble') { dependsOn subprojects.collect { it.tasks.named('assemble') } }
tasks.named('check') {
    dependsOn tasks.named('verifyCommonIsolation')
    dependsOn tasks.named('verifyLoaderJars')
    dependsOn subprojects.collect { it.tasks.named('check') }
}

apply from: rootProject.file('gradle/verify-mc1211-artifacts.gradle')
