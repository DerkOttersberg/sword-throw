[versions]
minecraft = "26.3"
java = "25"
architectury-plugin = "3.5.169"
architectury-loom = "1.17.493"
fabric-loader = "0.19.5"
fabric-api = "0.161.0+26.3"
fabric-minimum-api = "0.161.0"
fabric-maximum-api-exclusive = "0.162.0"
forge = "26.3-66.0.9"
neoforge = "26.3.0.48-beta"
seamless-api = "2.0.2+mc26.3"
modmenu = "21.0.0"
junit = "5.12.2"
mixin = "0.17.3+mixin.0.8.7"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
forge = { module = "net.minecraftforge:forge", version.ref = "forge" }
neoforge = { module = "net.neoforged:neoforge", version.ref = "neoforge" }
seamless-api-common = { module = "io.github.derkottersberg:seamless-api-common", version.ref = "seamless-api" }
seamless-api-fabric = { module = "io.github.derkottersberg:seamless-api-fabric", version.ref = "seamless-api" }
seamless-api-forge = { module = "io.github.derkottersberg:seamless-api-forge", version.ref = "seamless-api" }
seamless-api-neoforge = { module = "io.github.derkottersberg:seamless-api-neoforge", version.ref = "seamless-api" }
modmenu = { module = "com.terraformersmc:modmenu", version.ref = "modmenu" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "mixin" }

[plugins]
architectury = { id = "architectury-plugin", version.ref = "architectury-plugin" }
loom = { id = "dev.architectury.loom-no-remap", version.ref = "architectury-loom" }
