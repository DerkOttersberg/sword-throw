[versions]
minecraft = "26.2"
java = "25"
architectury-plugin = "3.5.169"
architectury-loom = "1.17.491"
fabric-loader = "0.19.3"
fabric-api = "0.158.0+26.2"
forge = "26.2-65.1.3"
neoforge = "26.2.0.75"
seamless-api = "2.0.0+mc26.2"
modmenu = "20.0.1"
junit = "5.12.2"
mixin = "0.17.4+"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
forge = { module = "net.minecraftforge:forge", version.ref = "forge" }
neoforge = { module = "net.neoforged:neoforge", version.ref = "neoforge" }
seamless-api-common = { module = "io.github.derkottersberg:seamless-api-common", version.ref = "seamless-api" }
seamless-api-fabric = { module = "io.github.derkottersberg:seamless-api-fabric", version.ref = "seamless-api" }
seamless-api-forge = { module = "io.github.derkottersberg:seamless-api-forge", version.ref = "seamless-api" }
seamless-api-neoforge = { module = "io.github.derkottersberg:seamless-api-neoforge", version.ref = "seamless-api" }
modmenu = { module = "com.terraformersmc:modmenu", version.ref = "modmenu" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "mixin" }

[plugins]
architectury = { id = "architectury-plugin", version.ref = "architectury-plugin" }
loom = { id = "dev.architectury.loom-no-remap", version.ref = "architectury-loom" }
