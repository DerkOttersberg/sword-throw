name: build

on:
  push:
    branches: [main, '26.2', '26.3', 'port/**', 'support/**', 'feat/**', 'fix/**', 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  wrapper-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: suite/sword-throw
      - uses: gradle/actions/wrapper-validation@v4
      - name: Upload wrapper-validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sword-throw-wrapper-validation-reports
          if-no-files-found: ignore
          path: |
            suite/**/build/reports/**
            suite/**/build/test-results/**
            suite/**/build/**/logs/**

  loader-builds:
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge, neoforge]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: suite/sword-throw
    steps:
      - uses: actions/checkout@v4
        with:
          path: suite/sword-throw
      - uses: actions/checkout@v4
        with:
          repository: DerkOttersberg/seamless-api
          ref: f05f7b04a85c47626555d21816f507dea0889b99
          path: suite/seamless-api
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :common:check :${{ matrix.loader }}:check :${{ matrix.loader }}:build
      - name: Upload ${{ matrix.loader }} diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sword-throw-${{ matrix.loader }}-reports
          if-no-files-found: ignore
          path: |
            suite/**/build/reports/**
            suite/**/build/test-results/**
            suite/**/build/**/logs/**
            suite/**/build/**/crash-reports/**
            suite/**/run/logs/**
            suite/**/run/**/crash-reports/**

  fabric-api-compatibility:
    strategy:
      fail-fast: false
      matrix:
        fabric_api_version: ['0.158.0+26.2', '0.159.0+26.2']
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: suite/sword-throw
    steps:
      - uses: actions/checkout@v4
        with:
          path: suite/sword-throw
      - uses: actions/checkout@v4
        with:
          repository: DerkOttersberg/seamless-api
          ref: f05f7b04a85c47626555d21816f507dea0889b99
          path: suite/seamless-api
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew "-PfabricApiVersion=${{ matrix.fabric_api_version }}" :common:check :fabric:check :fabric:build
      - name: Upload Fabric API ${{ matrix.fabric_api_version }} diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sword-throw-fabric-api-${{ matrix.fabric_api_version }}-reports
          if-no-files-found: ignore
          path: |
            suite/**/build/reports/**
            suite/**/build/test-results/**
            suite/**/build/**/logs/**
            suite/**/build/**/crash-reports/**
            suite/**/run/logs/**
            suite/**/run/**/crash-reports/**

  verification:
    needs: [wrapper-validation, loader-builds, fabric-api-compatibility]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: suite/sword-throw
    steps:
      - name: Require successful protected prerequisite jobs
        env:
          WRAPPER_VALIDATION_RESULT: ${{ needs.wrapper-validation.result }}
          LOADER_BUILDS_RESULT: ${{ needs.loader-builds.result }}
          FABRIC_API_COMPATIBILITY_RESULT: ${{ needs.fabric-api-compatibility.result }}
        run: |
          if [[ "$WRAPPER_VALIDATION_RESULT" != "success" || "$LOADER_BUILDS_RESULT" != "success" || "$FABRIC_API_COMPATIBILITY_RESULT" != "success" ]]; then
            echo "Required jobs failed: wrapper-validation=$WRAPPER_VALIDATION_RESULT loader-builds=$LOADER_BUILDS_RESULT fabric-api-compatibility=$FABRIC_API_COMPATIBILITY_RESULT"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          path: suite/sword-throw
      - uses: actions/checkout@v4
        with:
          repository: DerkOttersberg/seamless-api
          ref: f05f7b04a85c47626555d21816f507dea0889b99
          path: suite/seamless-api
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean check build
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sword-throw-verification-reports
          if-no-files-found: ignore
          path: |
            suite/**/build/reports/**
            suite/**/build/test-results/**
            suite/**/build/**/logs/**
            suite/**/build/**/crash-reports/**
            suite/**/run/logs/**
            suite/**/run/**/crash-reports/**
