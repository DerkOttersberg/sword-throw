name: build

on:
  push:
    branches: [main, 'port/**', 'support/**', 'feat/**', 'fix/**', 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  wrapper-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: suite/sword-throw
      - uses: gradle/actions/wrapper-validation@v4

  loader-builds:
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge, neoforge]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: suite/sword-throw
    steps:
      - uses: actions/checkout@v4
        with:
          path: suite/sword-throw
      - uses: actions/checkout@v4
        with:
          repository: DerkOttersberg/seamless-api
          ref: 694bea2a03083727843d8d4b6005dd173100bf8e
          path: suite/seamless-api
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :common:check :${{ matrix.loader }}:check :${{ matrix.loader }}:build

  verification:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: suite/sword-throw
    steps:
      - uses: actions/checkout@v4
        with:
          path: suite/sword-throw
      - uses: actions/checkout@v4
        with:
          repository: DerkOttersberg/seamless-api
          ref: 694bea2a03083727843d8d4b6005dd173100bf8e
          path: suite/seamless-api
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean check build
