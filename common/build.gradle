plugins { id 'dev.architectury.loom-no-remap' }
base { archivesName = rootProject.archives_base_name }

dependencies {
    minecraft libs.minecraft
    def seamlessApiCommon = files(rootProject.file("../seamless-api/common/build/libs/seamless-api-${libs.versions.seamless.api.get()}-common.jar"))
    seamlessApiCommon.builtBy gradle.includedBuild('seamless-api').task(':common:jar')
    api seamlessApiCommon
    // Minecraft's development classes carry Fabric environment annotations even
    // though this module never imports loader APIs. Keep the annotation type on
    // the compile classpath so Java 25 can read those class files without noise.
    compileOnly libs.fabric.loader
    compileOnly libs.mixin
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('jar', Jar) {
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-common.jar"
}
tasks.named('sourcesJar', Jar) {
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-common-sources.jar"
}
