plugins { id 'dev.architectury.loom-no-remap' }
base { archivesName = rootProject.archives_base_name }

def fabricApiVersion = providers.gradleProperty('fabricApiVersion')
    .getOrElse(libs.versions.fabric.api.get())

dependencies {
    minecraft libs.minecraft
    implementation libs.fabric.loader
    implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    compileOnly libs.modmenu
    def seamlessApiFabric = files(rootProject.file("../seamless-api/fabric/build/libs/seamless-api-${libs.versions.seamless.api.get()}-fabric.jar"))
    seamlessApiFabric.builtBy gradle.includedBuild('seamless-api').task(':fabric:jar')
    implementation seamlessApiFabric
    implementation project(':common')
}

loom {
    mods {
        swordthrow {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'swordthrow-gametest'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

dependencies { gametestImplementation project(':common') }

sourceSets.gametest.java.srcDir rootProject.file('common/src/gametest/java')
sourceSets.gametest.resources.srcDir rootProject.file('common/src/gametest/resources')

tasks.named('runGameTest') {
    doLast {
        def logFile = layout.buildDirectory.file('run/gameTest/logs/latest.log').get().asFile
        def match = logFile.exists() ? (logFile.text =~ /(\d+) tests are now running/) : null
        if (match == null || !match.find() || match.group(1).toInteger() < 6) {
            throw new GradleException('Fabric GameTest run did not discover all five Sword Throw scenarios')
        }
    }
}

def metadataProperties = [
    version: project.version.toString(),
    fabric_api_range: ">=${libs.versions.fabric.minimum.api.get()} <${libs.versions.fabric.maximum.api.exclusive.get()}"
]
processResources {
    inputs.properties metadataProperties
    filesMatching('fabric.mod.json') { expand metadataProperties }
}

tasks.named('jar', Jar) {
    from project(':common').sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-fabric.jar"
}
tasks.named('sourcesJar', Jar) {
    from project(':common').sourceSets.main.allSource
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-fabric-sources.jar"
}
