plugins { id 'dev.architectury.loom' }
base { archivesName = rootProject.archives_base_name }
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

def fabricApiVersion = providers.gradleProperty('fabricApiVersion')
    .getOrElse(libs.versions.fabric.api.get())

dependencies {
    minecraft libs.minecraft
    mappings loom.officialMojangMappings()
    modImplementation libs.fabric.loader
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    modCompileOnly libs.modmenu
    def seamlessApiFabric = files(rootProject.file("../seamless-api/fabric/build/devlibs/seamless-api-${libs.versions.seamless.api.get()}-fabric-dev.jar"))
    seamlessApiFabric.builtBy gradle.includedBuild('seamless-api').task(':fabric:jar')
    implementation seamlessApiFabric
}

loom {
    mixin { useLegacyMixinAp = true; defaultRefmapName = 'swordthrow.refmap.json' }
    mods {
        swordthrow {
            sourceSet sourceSets.main
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'swordthrow-gametest'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

sourceSets.gametest.java.srcDir rootProject.file('common/src/gametest/java')
sourceSets.gametest.resources.srcDir rootProject.file('common/src/gametest/resources')

tasks.named('runGameTest') {
    doLast {
        def logFile = layout.buildDirectory.file('run/gameTest/logs/latest.log').get().asFile
        def match = logFile.exists() ? (logFile.text =~ /(\d+) tests are now running/) : null
        if (match == null || !match.find() || match.group(1).toInteger() < 7
                || !logFile.text.contains('All 7 required tests passed')) {
            throw new GradleException('Fabric GameTest run did not discover all seven Sword Throw scenarios')
        }
    }
}
tasks.named('check') { dependsOn tasks.named('runGameTest') }

def metadataProperties = [
    version: project.version.toString(),
    fabric_api_range: ">=${libs.versions.fabric.minimum.api.get()} <${libs.versions.fabric.maximum.api.exclusive.get()}",
    modmenu_range: ">=${libs.versions.modmenu.get()} <${libs.versions.modmenu.get().tokenize('.')[0].toInteger() + 1}.0.0"
]
processResources {
    inputs.properties metadataProperties
    filesMatching('fabric.mod.json') { expand metadataProperties }
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-fabric-dev.jar"
}
tasks.named('sourcesJar', Jar) {
    from project(':common').sourceSets.main.allSource
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-fabric-sources.jar"
}
tasks.named('remapJar') { archiveFileName = "${rootProject.archives_base_name}-${project.version}-fabric.jar" }

tasks.named('remapSourcesJar') { archiveFileName = "${rootProject.archives_base_name}-${project.version}-fabric-sources.jar" }
