plugins { id 'dev.architectury.loom' }
base { archivesName = rootProject.archives_base_name }

sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}

sourceSets {
    gametest {
        java.srcDirs = ['src/gametest/java', rootProject.file('common/src/gametest/java')]
        resources.srcDirs = ['src/gametest/resources', rootProject.file('common/src/gametest/resources')]
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

apply from: rootProject.file('gradle/empty-gametest-structure.gradle')



dependencies {
    minecraft libs.minecraft
    mappings loom.officialMojangMappings()
    forge libs.forge
    def seamlessApiForge = files(rootProject.file("../seamless-api/forge/build/devlibs/seamless-api-${libs.versions.seamless.api.get()}-forge-dev.jar"))
    seamlessApiForge.builtBy gradle.includedBuild('seamless-api').task(':forge:jar')
    implementation seamlessApiForge
}

loom {
    mixin { useLegacyMixinAp = true; defaultRefmapName = 'swordthrow.refmap.json' }
    mods {
        swordthrow {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
    runs {
        gameTestServer {
            runtimeEnvironment = 'gametestserver'
            forgeTemplate 'gameTestServer'
            source sourceSets.gametest
            runDir 'build/gametest'
            property 'forge.enabledGameTestNamespaces', 'swordthrow'
        }
    }
}

tasks.named('runGameTestServer') {
    doLast {
        def logFile = layout.buildDirectory.file('gametest/logs/latest.log').get().asFile
        def match = logFile.exists() ? (logFile.text =~ /(\d+) tests are now running/) : null
        if (match == null || !match.find() || match.group(1).toInteger() < 7
                || !logFile.text.contains('All 7 required tests passed')) {
            throw new GradleException('Forge GameTest run did not discover all seven Sword Throw scenarios')
        }
    }
}
tasks.named('check') { dependsOn tasks.named('runGameTestServer') }

def metadataProperties = [
    mod_version: project.version.toString(),
    loader_version_range: '[47,)',
    forge_version_range: '[47.1,48)',
    minecraft_version_range: '[1.20.1,1.20.2)'
]
processResources {
    inputs.properties metadataProperties
    filesMatching('META-INF/mods.toml') { expand metadataProperties }
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/MANIFEST.MF'
    manifest {
        attributes(
            'Automatic-Module-Name': 'io.github.derkottersberg.swordthrow',
            'MixinConfigs': 'swordthrow.mixins.json'
        )
    }
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-forge-dev.jar"
}
tasks.named('sourcesJar', Jar) {
    from project(':common').sourceSets.main.allSource
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-forge-sources.jar"
}
tasks.named('remapJar') { archiveFileName = "${rootProject.archives_base_name}-${project.version}-forge.jar" }

tasks.named('remapSourcesJar') { archiveFileName = "${rootProject.archives_base_name}-${project.version}-forge-sources.jar" }
