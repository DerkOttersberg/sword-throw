plugins { id 'dev.architectury.loom-no-remap' }
base { archivesName = rootProject.archives_base_name }

sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    java.srcDir 'src/gametest/java'
    java.srcDir rootProject.file('common/src/gametest/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}

dependencies {
    minecraft libs.minecraft
    neoForge libs.neoforge
    def seamlessApiNeoForge = files(rootProject.file("../seamless-api/neoforge/build/libs/seamless-api-${libs.versions.seamless.api.get()}-neoforge.jar"))
    seamlessApiNeoForge.builtBy gradle.includedBuild('seamless-api').task(':neoforge:jar')
    implementation seamlessApiNeoForge
}

loom {
    mods {
        swordthrow {
            sourceSet sourceSets.main
        }
    }
    runs {
        gameTestServer {
            runtimeEnvironment = 'gametestserver'
            forgeTemplate 'gameTestServer'
            source sourceSets.main
            runDir 'build/gametest'
            property 'neoforge.enabledGameTestNamespaces', 'swordthrow'
        }
    }
}

tasks.named('runGameTestServer') {
    doFirst {
        project.copy {
            from rootProject.file('common/src/gametest/resources')
            into layout.buildDirectory.dir('resources/main')
        }
    }
    doLast {
        def logFile = layout.buildDirectory.file('gametest/logs/latest.log').get().asFile
        def match = logFile.exists() ? (logFile.text =~ /(\d+) tests are now running/) : null
        if (match == null || !match.find() || match.group(1).toInteger() < 8) {
            throw new GradleException('NeoForge GameTest run did not discover all seven Sword Throw scenarios')
        }
    }
}
tasks.named('check') { dependsOn tasks.named('runGameTestServer') }

def metadataProperties = [
    mod_version: project.version.toString(),
    loader_version_range: '[11,)',
    neo_version_range: '[26.2.0.75,26.3)',
    minecraft_version_range: '[26.2,26.3)'
]
processResources {
    inputs.properties metadataProperties
    filesMatching('META-INF/neoforge.mods.toml') { expand metadataProperties }
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude '**/gametest/**'
    exclude '**/SwordThrowGameTestConfigAccess.class'
    exclude 'data/swordthrow/tags/item/gametest_throwable.json'
    exclude 'data/swordthrow/tags/item/gametest_cannot_throw.json'
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-neoforge.jar"
}
tasks.named('sourcesJar', Jar) {
    from project(':common').sourceSets.main.allSource
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude '**/gametest/**'
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-neoforge-sources.jar"
}
