plugins { id 'dev.architectury.loom' }
base { archivesName = rootProject.archives_base_name }
sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}
sourceSets {
    gametest {
        java.srcDirs = ['src/gametest/java', rootProject.file('common/src/gametest/java')]
        resources.srcDirs = ['src/gametest/resources', rootProject.file('common/src/gametest/resources')]
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}
apply from: rootProject.file('gradle/empty-gametest-structure.gradle')
dependencies {
    minecraft libs.minecraft
    mappings loom.officialMojangMappings()
    neoForge libs.neoforge
    def apiJar = files(rootProject.file("../seamless-api/neoforge/build/devlibs/seamless-api-${libs.versions.seamless.api.get()}-neoforge-dev.jar"))
    apiJar.builtBy gradle.includedBuild('seamless-api').task(':neoforge:jar')
    implementation apiJar
}
def gameTestModRoot = layout.buildDirectory.dir('gametest-mod')
loom {
    mixin { useLegacyMixinAp = true; defaultRefmapName = 'swordthrow.refmap.json' }
    mods { swordthrow { sourceSet sourceSets.main; sourceSet sourceSets.gametest } }
    runs {
        gameTestServer {
            runtimeEnvironment = 'gametestserver'
            forgeTemplate 'gameTestServer'
            source sourceSets.gametest
            environmentVariable 'MOD_CLASSES', "swordthrow%%${gameTestModRoot.get().asFile.absolutePath}"
            runDir 'build/gametest'
            property 'neoforge.enabledGameTestNamespaces', 'swordthrow'
        }
    }
}
tasks.named('runGameTestServer') {
    doLast {
        def log = file('build/gametest/logs/latest.log')
        if (!log.isFile() || !log.text.contains('All 7 required tests passed')) {
            throw new GradleException('Expected all seven required Throw Weapons GameTests')
        }
    }
}
tasks.named('check') { dependsOn tasks.named('runGameTestServer') }
def metadata = [mod_version:project.version.toString(),loader_version_range:'[4,)',neo_version_range:'[21.1.255,21.2)',minecraft_version_range:'[1.21.1]']
processResources {
    inputs.properties metadata
    filesMatching('META-INF/neoforge.mods.toml') { expand metadata }
}
tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-neoforge-dev.jar"
}
tasks.named('sourcesJar', Jar) {
    from project(':common').sourceSets.main.allSource
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.named('remapJar') { archiveFileName = "${rootProject.archives_base_name}-${project.version}-neoforge.jar" }
tasks.named('remapSourcesJar') { archiveFileName = "${rootProject.archives_base_name}-${project.version}-neoforge-sources.jar" }
def stageGameTestMod = tasks.register('stageGameTestMod', Sync) {
    dependsOn tasks.named('classes'), tasks.named('gametestClasses')
    from sourceSets.main.output
    from sourceSets.gametest.output
    into gameTestModRoot
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.named('runGameTestServer') {
    dependsOn stageGameTestMod
    def sourceRoots = (sourceSets.main.output.files + sourceSets.gametest.output.files) as Set
    classpath = files(gameTestModRoot) + classpath.filter { !sourceRoots.contains(it) }
}
